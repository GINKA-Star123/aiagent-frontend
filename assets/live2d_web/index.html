<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>AIAgent Live2D Stage</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.95), rgba(255,224,214,0.64) 34%, rgba(255,198,185,0.72) 100%);
    }

    #live2d-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    #fallback-character {
      position: absolute;
      left: 50%;
      bottom: 34px;
      width: 132px;
      height: 178px;
      transform: translateX(-50%);
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(180deg, #fff8f4, #f7a79c);
      box-shadow: 0 18px 40px rgba(146, 59, 59, 0.22);
      transition: transform 220ms ease, filter 220ms ease, background 220ms ease;
    }

    #fallback-portrait {
      position: absolute;
      left: 50%;
      bottom: 0;
      max-width: 86%;
      max-height: 92%;
      transform: translateX(-50%);
      display: none;
      object-fit: contain;
      filter: drop-shadow(0 18px 28px rgba(124, 66, 62, 0.22));
    }

    #fallback-character::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -42px;
      width: 92px;
      height: 92px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(180deg, #fffaf7, #ffd0c4);
      border: 4px solid rgba(190, 78, 70, 0.22);
    }

    #fallback-face {
      position: absolute;
      left: 50%;
      top: -12px;
      width: 72px;
      height: 24px;
      transform: translateX(-50%);
      z-index: 3;
      color: #803a3a;
      text-align: center;
      font-size: 20px;
      line-height: 24px;
    }

    #motion {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.62);
      color: #773636;
      font-size: 11px;
      white-space: nowrap;
    }

    #status {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      color: rgba(83,48,45,0.72);
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #stage-label {
      position: absolute;
      left: 10px;
      top: 10px;
      max-width: calc(100vw - 20px);
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.58);
      color: #663735;
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
    }

    .happy {
      filter: saturate(1.08) brightness(1.02);
    }

    .sad {
      filter: saturate(0.82) brightness(0.96);
    }

    .angry {
      filter: saturate(1.25) contrast(1.04);
    }

    .speaking {
      animation: speaking-bounce 760ms ease-in-out infinite;
    }

    @keyframes speaking-bounce {
      0%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(-5px);
      }
    }
  </style>
</head>
<body>
  <main id="stage">
    <canvas id="live2d-canvas"></canvas>
    <div id="stage-label">Live2D stage initializing...</div>
    <img id="fallback-portrait" src="./fallback_yzl.png" alt="" />
    <div id="fallback-character">
      <div id="fallback-face">._.</div>
      <div id="motion">idle</div>
    </div>
    <div id="status">Waiting...</div>
  </main>

  <script src="./live2d_model_bundle.js"></script>
  <script src="./live2d_stage.js"></script>
</body>
</html>
