name: flutter_client
description: AIAgent product client.
publish_to: "none"

version: 1.0.0-rc.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  audioplayers: ^6.1.0
  record: ^5.2.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/live2d_web/
    - assets/live2d_web/cubism/
    - assets/live2d_web/vendor/
    - assets/live2d_web/models/yzl/
    - assets/live2d_web/models/yzl/textures/
    - assets/live2d_web/models/yzl/motions/
    - assets/live2d_web/models/yzl/expressions/
    - assets/live2d_web/models/yzl/physics/
